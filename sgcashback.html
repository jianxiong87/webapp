<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SGCashback">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="icon" href="icon-180.png">
<title>SGCashback</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#f2f2f7; --card:#fff; --label:#000; --label2:#3c3c4399; --label3:#8e8e93;
  --sep:#c6c6c8; --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --fill:#f2f2f7; --card2:#f2f2f7;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#ebebf599;--label3:#636366;--sep:#38383a;--fill:#2c2c2e;--card2:#2c2c2e;}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{position:fixed;inset:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--label);font-size:14px;}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;position:relative;overflow:hidden;touch-action:none;}
#content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior:contain;touch-action:pan-y;}
#content.frozen{overflow:hidden;display:flex;flex-direction:column;min-height:0;touch-action:none;}
.frozen-top{flex-shrink:0;touch-action:none;}
.frozen-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;overscroll-behavior:contain;touch-action:pan-y;}
.frozen-bottom{flex-shrink:0;touch-action:none;}
#tabbar{touch-action:none;}
#tabbar{display:flex;background:var(--card);border-top:0.5px solid var(--sep);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);flex-shrink:0;}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px 14px;border:none;background:none;cursor:pointer;gap:3px;opacity:.6;transition:opacity .15s;}
.tab-btn.active{opacity:1;color:var(--blue);}
.tab-icon{font-size:20px;line-height:1;}
.tab-label{font-size:10px;font-weight:500;color:inherit;}
.tab-btn.active .tab-label{color:var(--blue);}
.nav{display:flex;align-items:center;padding:12px 54px 10px 12px;border-bottom:0.5px solid var(--sep);background:var(--card);position:sticky;top:0;z-index:10;gap:8px;}
.nav-title{flex:1;text-align:center;font-size:17px;font-weight:600;}
.nav-arrow{font-size:22px;color:var(--blue);padding:0 4px;background:none;border:none;cursor:pointer;width:32px;}
.nav-btn{font-size:13px;color:var(--blue);font-weight:600;padding:4px 8px;background:none;border:none;cursor:pointer;}
.section{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 16px 12px;}
.section-title{font-size:15px;font-weight:600;margin-bottom:12px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.stat-card{background:var(--card);border-radius:14px;padding:14px;}
.stat-label{font-size:12px;font-weight:500;color:var(--label2);margin-bottom:4px;}
.stat-val{font-size:22px;font-weight:700;}
.stat-val.green{color:var(--green);}
.progress-bar-wrap{margin-bottom:12px;}
.progress-bar-head{display:flex;justify-content:space-between;margin-bottom:4px;}
.progress-bar-label{font-size:13px;font-weight:600;}
.progress-bar-val{font-size:12px;color:var(--label2);}
.progress-bar-val.met{color:var(--green);}
.progress-track{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .3s;}
.progress-excl{font-size:11px;color:var(--label3);margin-top:3px;}
.card-section-hd{display:flex;align-items:center;justify-content:space-between;margin:0 16px 6px;padding-left:10px;border-left:3px solid;}
.card-section-name{font-size:13px;font-weight:700;}
.card-section-cb{font-size:13px;font-weight:700;color:var(--green);}
.entry-row{display:flex;align-items:center;padding:10px 0;cursor:pointer;}
.entry-row+.entry-row{border-top:0.5px solid var(--sep);}
.entry-icon{font-size:22px;width:34px;text-align:center;flex-shrink:0;}
.entry-info{flex:1;min-width:0;}
.entry-label{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-sub{font-size:12px;color:var(--label2);margin-top:1px;}
.entry-right{text-align:right;flex-shrink:0;}
.entry-amt{font-size:15px;font-weight:600;}
.entry-cb{font-size:12px;font-weight:600;color:var(--green);margin-top:1px;}
.empty{display:flex;flex-direction:column;align-items:center;padding-top:80px;gap:8px;}
.empty-icon{font-size:48px;}
.empty-title{font-size:17px;font-weight:600;}
.empty-desc{font-size:14px;color:var(--label2);}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);right:max(20px, calc(50vw - 280px));width:56px;height:56px;border-radius:28px;background:var(--blue);border:none;color:#fff;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,122,255,.4);z-index:20;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;}
.modal-bg.open{display:block;}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;background:var(--card);border-radius:20px 20px 0 0;z-index:101;max-height:90dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,16px);}
.sheet-pill{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:10px auto 0;}
.sheet-hd{display:flex;align-items:center;padding:14px 16px 10px;}
.sheet-title{flex:1;font-size:18px;font-weight:700;}
.sheet-body{overflow-y:auto;padding:0 16px 16px;flex:1;}
.field-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--label2);margin-bottom:8px;margin-top:14px;}
.field-label:first-child{margin-top:0;}
.chips-scroll{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.chip{border-radius:8px;padding:6px 12px;background:var(--fill);border:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--label);}
.chip.active{background:var(--blue);color:#fff;}
.card-pick-row{display:flex;align-items:center;justify-content:space-between;border-radius:10px;padding:12px;background:var(--fill);margin-bottom:6px;cursor:pointer;border:1.5px solid transparent;}
.card-pick-row.active{border-color:var(--accent,var(--blue));}
.card-pick-name{font-size:14px;font-weight:600;}
.card-pick-right{text-align:right;}
.card-pick-rate{font-size:15px;font-weight:600;}
.card-pick-note{font-size:10px;margin-top:2px;}
.field-input{width:100%;background:var(--fill);border:none;border-radius:10px;padding:12px 14px;font-size:17px;color:var(--label);outline:none;font-family:inherit;}
.toggle-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;}
.toggle-track{width:44px;height:26px;border-radius:13px;background:var(--fill);position:relative;flex-shrink:0;transition:background .2s;}
.toggle-track.on{background:var(--blue);}
.toggle-thumb{width:22px;height:22px;border-radius:11px;background:#fff;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle-track.on .toggle-thumb{left:20px;}
.save-btn{width:100%;padding:16px;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;border:none;cursor:pointer;margin-top:12px;}
.save-btn:disabled{background:var(--fill);color:var(--label3);}
.del-btn{font-size:15px;color:var(--red);font-weight:600;background:none;border:none;cursor:pointer;padding:4px 8px;}
.close-btn{font-size:18px;color:var(--label2);background:none;border:none;cursor:pointer;padding:4px;}
.group-hdr{background:var(--fill);padding:6px 26px;margin:0 0 0;} 
.group-hdr-txt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--label2);}
.rates-wrap{overflow-x:auto;}
.rates-table{width:100%;border-collapse:collapse;}
.rates-table th{font-size:11px;font-weight:700;padding:8px 4px;text-align:center;border-bottom:1px solid var(--sep);}
.rates-table th.cat-col{text-align:left;padding-left:10px;}
.rates-table td{padding:8px 4px;text-align:center;border-bottom:0.5px solid var(--sep);font-size:12px;}
.rates-table td.cat-col{text-align:left;padding-left:10px;padding-right:4px;}
.rates-table tr:nth-child(even) td{background:var(--fill);}
.best-pill{background:rgba(52,199,89,.14);border-radius:6px;padding:2px 5px;color:var(--green);font-weight:700;}
.excl-txt{color:var(--label3);}
.low-txt{color:var(--label2);font-size:11px;}
.cat-lbl{font-size:12px;font-weight:500;}
.cat-mcc{font-size:10px;color:var(--label3);margin-top:1px;}
.filter-bar{display:flex;overflow-x:auto;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--sep);scrollbar-width:none;}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-chip{white-space:nowrap;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:var(--card);color:var(--label);}
.filter-chip.active{background:var(--blue);color:#fff;}
.hero-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:16px;}
.hero-card{background:var(--card);border-radius:14px;padding:12px;text-align:center;}
.hero-val{font-size:18px;font-weight:700;margin-bottom:2px;}
.hero-val.green{color:var(--green);}
.hero-lbl{font-size:11px;color:var(--label2);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{font-size:13px;font-weight:500;width:80px;flex-shrink:0;}
.bar-track{flex:1;height:8px;background:var(--fill);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.bar-right{font-size:12px;color:var(--label2);width:80px;text-align:right;flex-shrink:0;}
.acc-month{border-bottom:0.5px solid var(--sep);}
.acc-month-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:var(--card);}
.acc-month-label{font-size:15px;font-weight:600;}
.acc-month-total{font-size:13px;color:var(--label2);}
.acc-month-body{padding:0 16px 12px;}
.ins-row{display:flex;align-items:flex-start;padding:8px 0;gap:10px;}
.ins-row+.ins-row{border-top:0.5px solid var(--sep);}
.ins-person{font-size:11px;font-weight:700;width:56px;padding-top:2px;flex-shrink:0;}
.ins-info{flex:1;min-width:0;}
.ins-cat{font-size:13px;font-weight:500;}
.ins-note{font-size:11px;color:var(--label2);margin-top:1px;}
.ins-card{font-size:11px;color:var(--label3);}
.ins-amt{font-size:14px;font-weight:600;text-align:right;flex-shrink:0;}
.ins-table{width:100%;border-collapse:collapse;font-size:12px;}
.ins-table th,.ins-table td{padding:6px 8px;border-bottom:0.5px solid var(--sep);}
.ins-table th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--label2);text-align:right;}
.ins-table th:first-child,.ins-table td:first-child{text-align:left;}
.ins-table td{text-align:right;}
.ins-cpf{color:var(--orange);}
.monthly-row{display:flex;align-items:center;padding:10px 0;gap:8px;cursor:pointer;}
.monthly-row+.monthly-row{border-top:0.5px solid var(--sep);}
.monthly-date{font-size:13px;font-weight:600;width:36px;flex-shrink:0;}
.monthly-bal{font-size:14px;font-weight:600;flex:1;text-align:right;}
.monthly-in{font-size:13px;color:var(--green);width:70px;text-align:right;}
.monthly-out{font-size:13px;color:var(--red);width:70px;text-align:right;}
.monthly-remark{font-size:11px;color:var(--label3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:60px;}
.seg-ctrl{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:6px 16px;}
.seg-btn{flex:1;padding:5px 7px;border-radius:8px;border:none;background:none;font-size:14px;font-weight:500;cursor:pointer;color:var(--label2);transition:background .15s,color .15s;}
.seg-btn.active{background:var(--card);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.advisor-search{background:var(--fill);border:none;border-radius:12px;padding:10px 14px 10px 36px;font-size:15px;color:var(--label);outline:none;width:100%;font-family:inherit;}
.search-wrap{position:relative;padding:10px 16px;}
.search-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--label3);font-size:16px;pointer-events:none;}
.cat-row{display:flex;align-items:center;padding:12px 16px;gap:12px;cursor:pointer;background:var(--card);}
.cat-row:active{background:var(--fill);}
.cat-row+.cat-row{border-top:0.5px solid var(--sep);}
.cat-row-icon{font-size:24px;width:36px;text-align:center;}
.cat-row-info{flex:1;}
.cat-row-label{font-size:15px;font-weight:500;}
.cat-row-mcc{font-size:12px;color:var(--label3);}
.cat-row-arrow{color:var(--sep);font-size:16px;}
.ranked-row{display:flex;align-items:center;padding:10px 0;gap:10px;}
.ranked-row+.ranked-row{border-top:0.5px solid var(--sep);}
.ranked-num{font-size:12px;color:var(--label3);width:16px;}
.ranked-name{flex:1;font-size:14px;font-weight:500;}
.ranked-rate{font-size:15px;font-weight:700;}
.ranked-cb{font-size:12px;color:var(--label2);}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;}
.settings-row+.settings-row{border-top:0.5px solid var(--sep);}
.settings-row-label{font-size:15px;}
.danger-btn{width:100%;padding:14px;border-radius:12px;background:rgba(255,59,48,.1);color:var(--red);font-size:15px;font-weight:600;border:none;cursor:pointer;margin-top:4px;}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-box{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;}
.settings-gear{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;width:34px;height:34px;border-radius:17px;background:var(--fill);border:none;color:var(--label2);font-size:16px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;}
.toast.show{opacity:1;}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--label3);font-size:15px;}
</style>
</head>
<body>
<div id="app">
  <button id="settings-gear" class="settings-gear" onclick="openSettingsSheet()">⚙</button>
  <div id="content"></div>
  <nav id="tabbar"></nav>
  <div id="modal-bg" class="modal-bg"></div>
  <div id="sheet-wrap" style="display:none"></div>
  <div id="toast" class="toast"></div>
</div>

// ── AUTO-RECURRING INSURANCE (mirrors native app behaviour) ─────────────────
function seriesKeyOf(id) { return id.replace(/_\d{4}$/, ''); }

async function autoSeedYearlyInsurance() {
  const now = new Date();
  const curYear = now.getFullYear();
  const groups = {};
  for(const e of S.insurance) {
    const key = seriesKeyOf(e.id);
    if(!groups[key] || e.year > groups[key].year) groups[key] = e;
  }
  const created = [];
  for(const key in groups) {
    const latest = groups[key];
    for(let y = latest.year + 1; y <= curYear; y++) {
      const anniversary = new Date(y, latest.month, latest.day||1);
      if(now < anniversary) continue;
      const newId = `${key}_${y}`;
      if(S.insurance.some(e=>e.id===newId)) continue;
      const ne = {...latest, id:newId, year:y};
      try { await addInsuranceEntry(ne); } catch(err){ console.warn('[storage] autoSeedYearlyInsurance failed:', err); }
      S.insurance = [...S.insurance, ne];
      created.push(ne);
    }
  }
  if(created.length) console.log(`[storage] autoSeedYearlyInsurance: created ${created.length}`);
  return created;
}

async function autoAddInsuranceToBills(insEntry) {
  if(!insEntry.cardId) return; // CPF-paid entries don't hit any card
  const billId = `autoins_${insEntry.id}`;
  if(S.entries.some(e=>e.id===billId)) return; // already linked, avoid duplicates
  const pad = n => String(n).padStart(2,'0');
  const date = `${insEntry.year}-${pad(insEntry.month+1)}-${pad(insEntry.day||1)}`;
  const ne = {id:billId, date, catId:'insurance', cardId:insEntry.cardId, amount:insEntry.amount, isOverseas:false};
  try {
    await addEntryWithId(ne);
    S.entries = [...S.entries, ne];
    console.log(`[storage] autoAddInsuranceToBills: added $${insEntry.amount}`);
  } catch(err){ console.warn('[storage] autoAddInsuranceToBills failed:', err); }
}

async function autoSyncAllInsuranceToBills() {
  for(const e of S.insurance) await autoAddInsuranceToBills(e);
}

function getRateFor(cat, cardId) {
  const card = CARDS.find(c=>c.id===cardId);
  if(!card) return {};
  return cat.rates[card.rateKey] || {};

function getEffVal(rv) {
  if(!rv||rv.f==='excl'||rv.pct===0) return 0;
  if(rv.f==='miles') return (rv.mpd||0)*0.015;
  return rv.pct||0;
}
function calcCashback(rv, amount) {
  if(!rv||!rv.pct||rv.f==='excl'||rv.f==='miles') return null;
  const raw = rv.pct*amount;
  return rv.cap ? Math.min(raw,rv.cap) : raw;
}

  clearTimeout(_toast); _toast=setTimeout(()=>el.classList.remove('show'),2000);
}

function showCatDetail(catId) {
  const cat = CATS.find(c=>c.id===catId);
  if(!cat) return;
  let isOverseas = false;
  let amount = '';

  function computeDeduped() {
    const myCards = S.settings.myCards;
    const ranked = myCards.map(cardId=>{
      const card = CARDS.find(c=>c.id===cardId);
      if(!card) return null;
      let rv = {...getRateFor(cat, cardId)};
      if(isOverseas && cardId==='uobEvol' && rv.pct===0.10) rv = {...rv,pct:0.01,label:'1% (overseas)'};
      return {card, rv, val:getEffVal(rv)};
    }).filter(x=>x&&x.val>0).sort((a,b)=>b.val-a.val);
    // Deduplicate by rateKey
    const seen=new Set();
    return ranked.filter(x=>{const k=x.card.rateKey; if(seen.has(k)) return false; seen.add(k); return true;});
  }

  function buildResults() {
    const deduped = computeDeduped();
    const amtNum = parseFloat(amount)||0;
    return `<div class="field-label">Best Card to Use</div>
      ${deduped.length===0?'<div style="color:var(--label3);font-size:14px;padding:8px 0">All cards excluded for this category.</div>':
        deduped.map((x,i)=>{
          const cb = amtNum>0 ? calcCashback(x.rv, amtNum) : null;
          return `<div class="ranked-row">
            <div class="ranked-num">${i+1}</div>
            <div>
              <div class="ranked-name" style="color:${x.card.accent}">${x.card.name}</div>
              ${cb!=null?`<div class="ranked-cb">≈ ${fmt(cb)} cashback</div>`:''}
            </div>
            <div style="text-align:right">
              <div class="ranked-rate" style="color:${x.card.accent}">${x.rv.label}</div>
            </div>
          </div>`;
        }).join('')
      }
      <button class="save-btn" style="margin-top:16px" onclick="closeSheet();openAddBill('${catId}','${deduped[0]?.card?.id||''}')">
        + Add to Bills
      </button>`;
  }

  function buildDetail() {
    return `<div class="sheet-pill"></div>
    <div class="sheet-hd">
      <div class="sheet-title">${cat.icon} ${cat.label}</div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body">
      ${cat.note?`<div style="background:var(--fill);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--label2)">${escHtml(cat.note)}</div>`:''}
      <div class="field-label">Transaction Type</div>
      <div style="display:flex;gap:8px;margin-bottom:14px" id="txnTypeChips">
        <button class="chip ${!isOverseas?'active':''}" onclick="window._setOverseas(false)">🇸🇬 Local</button>
        <button class="chip ${isOverseas?'active':''}" onclick="window._setOverseas(true)">🌐 Overseas</button>
      </div>
      <div class="field-label">Amount ($) — for cashback preview</div>
      <input class="field-input" style="margin-bottom:14px" type="text" inputmode="decimal" pattern="[0-9]*\.?[0-9]*" placeholder="e.g. 150.00" value="${amount}"
        oninput="window._onAdvisorAmt(this.value)">
      <div id="catDetailResults">${buildResults()}</div>
    </div>`;
  }

  window._onAdvisorAmt = function(val) {
    amount = val;
    const results = document.getElementById('catDetailResults');
    if(results) results.innerHTML = buildResults();
  };
  window._setOverseas = function(val) {
    isOverseas = val;
    const chips = document.getElementById('txnTypeChips');
    if(chips) {
      chips.children[0].classList.toggle('active', !isOverseas);
      chips.children[1].classList.toggle('active', isOverseas);
    }
    const results = document.getElementById('catDetailResults');
    if(results) results.innerHTML = buildResults();
  };
  openSheet(buildDetail());
}

function getBillsCalc(entries) {
  const monthEntries = entries.filter(e=>{
    const d=new Date(e.date); return d.getFullYear()===S.billsYear && d.getMonth()===S.billsMonth;
  });
  const cbByCard={};
  let totalSpend=0;
  monthEntries.forEach(e=>{
    const cat=CATS.find(c=>c.id===e.catId); if(!cat) return;
    const rv=getRateFor(cat,e.cardId);
    const cb=calcCashback(rv,e.amount)||0;
    cbByCard[e.cardId]=(cbByCard[e.cardId]||0)+cb;
    totalSpend+=e.amount;
  });
  // OCBC cap
  const ocbcXJElig=monthEntries.filter(e=>e.cardId==='ocbcXJ').reduce((s,e)=>s+(NO_MIN_SPEND.ocbc365.has(e.catId)?0:e.amount),0);
  const ocbcJXElig=monthEntries.filter(e=>e.cardId==='ocbcJX').reduce((s,e)=>s+(NO_MIN_SPEND.ocbc365.has(e.catId)?0:e.amount),0);
  if((cbByCard['ocbcXJ']||0)>0) cbByCard['ocbcXJ']=Math.min(cbByCard['ocbcXJ'],ocbcXJElig>=1600?160:80);
  if((cbByCard['ocbcJX']||0)>0) cbByCard['ocbcJX']=Math.min(cbByCard['ocbcJX'],ocbcJXElig>=1600?160:80);
  const totalCB=Object.values(cbByCard).reduce((s,v)=>s+v,0);
  return {monthEntries,cbByCard,totalSpend,totalCB,ocbcXJElig,ocbcJXElig};
}

function renderBills() {
  const {monthEntries,cbByCard,totalSpend,totalCB,ocbcXJElig,ocbcJXElig} = getBillsCalc(S.entries);

  const ocbcXJExcl=monthEntries.filter(e=>e.cardId==='ocbcXJ').reduce((s,e)=>s+(NO_MIN_SPEND.ocbc365.has(e.catId)?e.amount:0),0);
  const ocbcJXExcl=monthEntries.filter(e=>e.cardId==='ocbcJX').reduce((s,e)=>s+(NO_MIN_SPEND.ocbc365.has(e.catId)?e.amount:0),0);
  const evolEntries=monthEntries.filter(e=>e.cardId==='uobEvol');
  const oneDebitEntries=monthEntries.filter(e=>e.cardId==='uobOneDebit');
  const evolElig=evolEntries.reduce((s,e)=>s+(NO_MIN_SPEND.uobEvol.has(e.catId)?0:e.amount),0);
  const evolExcl=evolEntries.reduce((s,e)=>s+(NO_MIN_SPEND.uobEvol.has(e.catId)?e.amount:0),0);
  const allOne=[...evolEntries,...oneDebitEntries];
  const oneElig=allOne.reduce((s,e)=>s+(NO_MIN_SPEND.uobOne.has(e.catId)?0:e.amount),0);
  const oneExcl=allOne.reduce((s,e)=>s+(NO_MIN_SPEND.uobOne.has(e.catId)?e.amount:0),0);

  const hasOCBCxj=monthEntries.some(e=>e.cardId==='ocbcXJ');
  const hasOCBCjx=monthEntries.some(e=>e.cardId==='ocbcJX');
  const hasEvol=monthEntries.some(e=>e.cardId==='uobEvol');
  const hasOneDebit=monthEntries.some(e=>e.cardId==='uobOneDebit');

  function minBar(label,amount,excl,color,target) {
    const pct=Math.min(amount/target,1);
    const met=amount>=target;
    const toGo=target-amount;
    return `<div class="progress-bar-wrap">
      <div class="progress-bar-head">
        <span class="progress-bar-label">${label}</span>
        <span class="progress-bar-val ${met?'met':''}">${fmt(amount)} / $${target} ${met?'✓':`($${fmtN(toGo)} to go)`}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct*100}%;background:${met?'var(--green)':color}"></div></div>
      ${excl>0?`<div class="progress-excl">+ $${fmtN(excl)} excluded (not counted toward min-spend)</div>`:''}
    </div>`;
  }

  let minSpendSec='';
  if(hasOCBCxj||hasOCBCjx||hasEvol) {
    minSpendSec=`<div class="section">
      <div class="section-title">$800 Min-Spend (Cashback)</div>
      ${hasOCBCxj?minBar('OCBC XJ',ocbcXJElig,ocbcXJExcl,'#d6232a',800):''}
      ${hasOCBCjx?minBar('OCBC JX',ocbcJXElig,ocbcJXExcl,'#c0392b',800):''}
      ${hasEvol?minBar('UOB Evol',evolElig,evolExcl,'#1a4fa0',800):''}
    </div>`;
  }
  let oneSec='';
  if(hasEvol||hasOneDebit) {
    oneSec=`<div class="section">
      <div class="section-title">$500 UOB ONE Qualifying Spend</div>
      ${minBar('EVOL + ONE Debit → ONE Account',oneElig,oneExcl,'#0070ba',500)}
      <div style="font-size:11px;color:var(--label3);margin-top:-4px">Insurance & utilities count here (excluded from Evol $800 above)</div>
    </div>`;
  }

  const activeCards = CARDS.filter(card=>monthEntries.some(e=>e.cardId===card.id));
  let entriesHtml='';
  if(monthEntries.length===0) {
    entriesHtml=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No bills yet</div><div class="empty-desc">Tap + to add a transaction</div></div>`;
  } else {
    entriesHtml = activeCards.map(card=>{
      const cardEntries=monthEntries.filter(e=>e.cardId===card.id).sort((a,b)=>b.date.localeCompare(a.date));
      const cardCB=cbByCard[card.id]||0;
      return `<div style="margin-bottom:12px">
        <div class="card-section-hd" style="border-color:${card.accent}">
          <span class="card-section-name" style="color:${card.accent}">${card.name}</span>
          ${cardCB>0?`<span class="card-section-cb">+${fmt(cardCB)}</span>`:''}
        </div>
        <div class="section" style="margin-top:0">
          ${cardEntries.map((e,i)=>{
            const cat=CATS.find(c=>c.id===e.catId);
            const rv=cat?getRateFor(cat,e.cardId):{};
            const cb=cat?(calcCashback(rv,e.amount)||0):0;
            return `<div class="entry-row" onclick="openEditBill('${e.id}')" oncontextmenu="event.preventDefault();deleteBillConfirm('${e.id}')">
              <div class="entry-icon">${cat?.icon||'💳'}</div>
              <div class="entry-info">
                <div class="entry-label">${cat?.label||e.catId}</div>
                <div class="entry-sub">${e.date}${e.isOverseas?' 🌐':''}</div>
              </div>
              <div class="entry-right">
                <div class="entry-amt">${fmt(e.amount)}</div>
                ${cb>0?`<div class="entry-cb">+${fmt(cb)}</div>`:''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');
  }

  return `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">Total Spend</div><div class="stat-val">${fmt(totalSpend)}</div></div>
      <div class="stat-card"><div class="stat-label">Cashback</div><div class="stat-val green">${fmt(totalCB)}</div></div>
    </div>
    ${minSpendSec}${oneSec}
    <div style="padding-bottom:80px">${entriesHtml}</div>`;
}

function openBillSheet(editEntry, prefillCatId='', prefillCardId='') {
  const isEdit = !!editEntry;
  const isShopbackSub = editEntry ? CATS.find(c=>c.id===editEntry.catId)?.group==='shopback' : false;
  let catId = isShopbackSub ? 'shopbackgo' : (editEntry?.catId||prefillCatId||'');
  let subCatId = isShopbackSub ? (editEntry?.catId||'') : '';
  let cardId = editEntry?.cardId||prefillCardId||'';
  let amount = editEntry ? String(editEntry.amount) : '';
  let date = editEntry?.date||(()=>{const d=new Date();return `${S.billsYear}-${String(S.billsMonth+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})();
  let isOverseas = editEntry?.isOverseas||false;

  function buildSheet() {
    const selectedCat = CATS.find(c=>c.id===catId);
    const selectedSub = subCatId ? CATS.find(c=>c.id===subCatId) : null;
    const effectiveCat = selectedSub||(selectedCat?.subGroup?null:selectedCat);
    const canSave = catId&&cardId&&amount&&parseFloat(amount)>0&&(!selectedCat?.subGroup||!!subCatId);

    // Category chips grouped
    const mainGroups = GROUPS.filter(g=>g.id!=='shopback');
    let catChipsHtml = mainGroups.map(g=>{
      const cats=CATS.filter(c=>c.group===g.id);
      return cats.map(c=>`<button class="chip ${catId===c.id?'active':''}" onclick="window._bc.setCat('${c.id}')">${c.icon} ${c.label}</button>`).join('');
    }).join('');

    let subChipsHtml='';
    if(selectedCat?.subGroup) {
      const subs=CATS.filter(c=>c.group===selectedCat.subGroup);
      subChipsHtml=`<div class="field-label">Merchant Type</div>
        <div class="chips-scroll">${subs.map(s=>`<button class="chip ${subCatId===s.id?'active':''}" onclick="window._bc.setSub('${s.id}')">${s.icon} ${s.label}</button>`).join('')}</div>`;
    }

    let cardPickHtml='';
    if(catId&&(!selectedCat?.subGroup||subCatId)) {
      const activeCatId = effectiveCat?.id||catId;
      cardPickHtml=`<div class="field-label">Card</div>` +
        CARDS.map(card=>{
          const rv=effectiveCat?getRateFor(effectiveCat,card.id):{};
          const isExcl=rv.f==='excl'||rv.pct===0;
          const isOneCard=card.id==='uobEvol'||card.id==='uobOneDebit';
          const countsForOne=isOneCard&&activeCatId&&!NO_MIN_SPEND.uobOne.has(activeCatId);
          return `<div class="card-pick-row ${cardId===card.id?'active':''}" style="${cardId===card.id?`--accent:${card.accent};`:''}opacity:${isExcl?.6:1}" onclick="window._bc.setCard('${card.id}')">
            <div class="card-pick-name" style="color:${card.accent}">${card.name}</div>
            <div class="card-pick-right">
              <div class="card-pick-rate" style="color:${isExcl?'var(--label3)':'var(--label)'}">${rv.label||'—'}</div>
              ${isOneCard?`<div class="card-pick-note" style="color:${countsForOne?'var(--green)':'var(--label3)'}">${countsForOne?'✓ counts to UOB ONE Acc $500':'✗ excl from UOB ONE Acc $500'}</div>`:''}
            </div>
          </div>`;
        }).join('');
    }

    let amtDateHtml='';
    if(catId&&cardId) {
      amtDateHtml=`<div class="field-label">Amount ($)</div>
        <input class="field-input" style="margin-bottom:12px" type="number" step="0.01" placeholder="e.g. 150.00" value="${amount}" oninput="window._bc.setAmt(this.value)">
        <div class="field-label">Date</div>
        <input class="field-input" style="margin-bottom:12px" type="date" value="${date}" oninput="window._bc.setDate(this.value)">
        <div class="toggle-row" onclick="window._bc.toggleOverseas()">
          <div class="toggle-track ${isOverseas?'on':''}"><div class="toggle-thumb"></div></div>
          <span style="font-size:14px">🌐 Overseas transaction</span>
        </div>`;
    }

    return `<div class="sheet-pill"></div>
    <div class="sheet-hd">
      <div class="sheet-title">${isEdit?'Edit Bill':'Add Bill'}</div>
      <div style="display:flex;gap:12px;align-items:center">
        ${isEdit?`<button class="del-btn" onclick="window._bc.del()">Delete</button>`:''}
        <button class="close-btn" onclick="closeSheet()">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div class="field-label">Category</div>
      <div class="chips-scroll">${catChipsHtml}</div>
      ${subChipsHtml}
      ${cardPickHtml}
      ${amtDateHtml}
      <button class="save-btn" ${!canSave?'disabled':''} onclick="window._bc.save()">
        ${isEdit?'Update':'Save'}
      </button>
    </div>`;
  }

  window._bc = {
    setCat(id){catId=id;subCatId='';cardId='';refreshSheet();},
    setSub(id){subCatId=id;cardId='';refreshSheet();},
    setCard(id){cardId=id;refreshSheet();},
    setAmt(v){amount=v;},
    setDate(v){date=v;},
    toggleOverseas(){isOverseas=!isOverseas;refreshSheet();},
    del(){confirmDialog('Remove this bill entry?',async()=>{S.entries=S.entries.filter(e=>e.id!==editEntry.id);await deleteEntry(editEntry.id);closeSheet();render();showToast('Deleted');});},
    async save(){
      const selectedCat=CATS.find(c=>c.id===catId);
      const selectedSub=subCatId?CATS.find(c=>c.id===subCatId):null;
      const effectiveCat=selectedSub||(selectedCat?.subGroup?null:selectedCat);
      const finalCatId=effectiveCat?.id||catId;
      const entry={catId:finalCatId,cardId,amount:parseFloat(amount),date,isOverseas};
      if(isEdit){await updateEntry(editEntry.id,entry);S.entries=S.entries.map(e=>e.id===editEntry.id?{...e,...entry}:e);showToast('Updated');}
      else{const ne=await addEntry(entry);S.entries=[...S.entries,ne];showToast('Saved');}
      closeSheet();render();
    }
  };
  function refreshSheet(){const w=document.querySelector('#sheet-wrap .sheet');if(w)w.innerHTML=buildSheet();}
  openSheet(buildSheet());
}

  const totalCB2=Object.values(cbByCard2).reduce((s,v)=>s+v,0);

    }).join('');

  // By category
  const byCat={};
  monthEntries.forEach(e=>{
    if(!byCat[e.catId]) byCat[e.catId]={spend:0,cb:0};
    const cat=CATS.find(c=>c.id===e.catId);

    byCat[e.catId].spend+=e.amount;
    byCat[e.catId].cb+=calcCashback(rv,e.amount)||0;

  return `<div class="hero-row">

function monthStatsFor(accId, y, m) {
  const setup = S.bankSetup[accId]||{isSetup:false,initBal:0,initDate:''};
  const daily = S.bankDaily[accId]||{};
  if(!setup.isSetup || !setup.initDate) return null;
  const initDate = setup.initDate;
  const days = daysInMonth(y,m);
  let bal = setup.initBal||0;
  // walk from initDate up to start of this month to establish opening balance
  const monthStartYM = `${y}-${String(m+1).padStart(2,'0')}`;
  if(initDate.slice(0,7) < monthStartYM) {
    Object.entries(daily).forEach(([date,rows])=>{
      if(date>=initDate && date.slice(0,7)<monthStartYM) {
        rows.forEach(r=>{ bal+=r.in||0; bal-=r.out||0; });
      }
    });
  } else if(initDate.slice(0,7) > monthStartYM) {
    return null; // account didn't exist yet this month
  }
  let totalIn=0, totalOut=0, balances=[];
  let hasAnyDay=false;
  for(let d=1; d<=days; d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(ds<initDate) continue;
    hasAnyDay=true;
    const rows=daily[ds]||[];
    const dayIn=rows.reduce((s,r)=>s+(r.in||0),0);
    const dayOut=rows.reduce((s,r)=>s+(r.out||0),0);
    bal+=dayIn; bal-=dayOut;
    totalIn+=dayIn; totalOut+=dayOut;
    balances.push(bal);
  }
  if(!hasAnyDay) return null;
  const avgBal = balances.reduce((s,v)=>s+v,0)/balances.length;
  return {totalIn, totalOut, avgBal};
}

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEKENDS = [0,6];

function buildMonthRows(y, m, initBal, initDate, daily) {
  // m is 0-indexed here (matches webapp convention elsewhere)
  if(!initDate) return [];
  const mStart = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const nextM = m===11 ? `${y+1}-01-01` : `${y}-${String(m+2).padStart(2,'0')}-01`;
  const from = initDate > mStart ? initDate : mStart;
  const to = addDaysStr(nextM, -1); // show full month regardless of today
  if(from > to) return [];
  let bal = from <= initDate ? initBal : eodBal(addDaysStr(from,-1), initBal, initDate, daily);
  const rows = [];
  let cur = from;
  while(cur <= to) {
    const entries = daily[cur] || [];
    const dayIn = entries.reduce((s,e)=>s+(e.in||0),0);
    const dayOut = entries.reduce((s,e)=>s+(e.out||0),0);
    bal += dayIn - dayOut;
    rows.push({date:cur, bal, totalIn:dayIn, totalOut:dayOut, entries});
    cur = addDaysStr(cur, 1);
  }
  return rows;
}
function addDaysStr(ds, n) {
  const d = new Date(ds+'T00:00:00');
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function eodBal(date, initBal, initDate, daily) {
  if(!initDate || date<initDate) return initBal;
  let bal=initBal, cur=initDate;
  while(cur<=date) {
    const entries = daily[cur]||[];
    bal += entries.reduce((s,e)=>s+(e.in||0),0) - entries.reduce((s,e)=>s+(e.out||0),0);
    cur = addDaysStr(cur,1);
  }
  return bal;
}
function openBalFor(date, initBal, initDate, daily) {
  if(!initDate || date<=initDate) return initBal;
  return eodBal(addDaysStr(date,-1), initBal, initDate, daily);
}

  const openingRow = `<div class="monthly-row" style="background:var(--fill);padding:10px 0">

    <div style="text-align:center"><div style="font-size:13px;font-weight:700;color:var(--green)">+${fmtN(totalIn)}</div><div style="font-size:11px;color:var(--label2)">Total In</div></div>

window.openDaySheet = function(ds) {
  const accId=S.monthlyAccount;
  let rows=[...(S.bankDaily[accId]?.[ds]||[{in:0,out:0,remark:''}])];
  if(rows.length===0) rows=[{in:'',out:'',remark:''}];

  function buildDS() {
    return `<div class="sheet-pill"></div>
    <div class="sheet-hd">
      <div class="sheet-title">${ds}</div>
      <button class="close-btn" onclick="closeSheet()">✕</button>
    </div>
    <div class="sheet-body">
      ${rows.map((r,i)=>`<div style="background:var(--fill);border-radius:10px;padding:12px;margin-bottom:10px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div><div class="field-label" style="margin-top:0">In ($)</div>
            <input class="field-input" type="text" inputmode="decimal" pattern="[0-9]*\.?[0-9]*" placeholder="0" value="${r.in||''}" oninput="window._ds.setIn(${i},this.value)"></div>
          <div><div class="field-label" style="margin-top:0">Out ($)</div>
            <input class="field-input" type="text" inputmode="decimal" pattern="[0-9]*\.?[0-9]*" placeholder="0" value="${r.out||''}" oninput="window._ds.setOut(${i},this.value)"></div>
        </div>
        <div class="field-label" style="margin-top:0">Remark</div>
        <input class="field-input" placeholder="e.g. Salary, Rent…" value="${escHtml(r.remark||'')}" oninput="window._ds.setRemark(${i},this.value)">
        ${rows.length>1?`<button onclick="window._ds.removeRow(${i})" style="color:var(--red);background:none;border:none;cursor:pointer;font-size:13px;margin-top:8px">✕ Remove</button>`:''}
      </div>`).join('')}
      <button onclick="window._ds.addRow()" style="color:var(--blue);background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;padding:8px 0">+ Add Row</button>
      <button class="save-btn" onclick="window._ds.save()">Save</button>
      <button onclick="window._ds.clear()" class="danger-btn" style="margin-top:8px">Clear Day</button>
    </div>`;
  }

  window._ds = {
    setIn(i,v){rows[i].in=parseFloat(v)||0;},
    setOut(i,v){rows[i].out=parseFloat(v)||0;},
    setRemark(i,v){rows[i].remark=v;},
    addRow(){rows.push({in:'',out:'',remark:''});refreshDS();},
    removeRow(i){rows.splice(i,1);refreshDS();},
    async save(){
      const clean=rows.filter(r=>(r.in||0)>0||(r.out||0)>0||r.remark);
      if(!S.bankDaily[accId]) S.bankDaily[accId]={};
      const dayNonWorking = isNonWorkingDay(ds);
      const staying=[], shifted=[];
      clean.forEach(r=>{
        if(dayNonWorking && (r.in||0)>0) shifted.push(r); else staying.push(r);
      });
      if(staying.length===0) delete S.bankDaily[accId][ds];
      else S.bankDaily[accId][ds]=staying;
      if(shifted.length>0) {
        const targetDate = nextWorkingDayStr(ds);
        const reason = shiftReasonLabel(ds);
        const moved = shifted.map(r=>({...r, remark: r.remark ? `${r.remark} (moved from ${reason})` : `Moved from ${reason}`}));
        const existing = S.bankDaily[accId][targetDate]||[];
        S.bankDaily[accId][targetDate] = [...existing, ...moved];
      }
      await saveDailyData(accId, S.bankDaily[accId]);
      closeSheet();
      const scrollEl=document.querySelector('.frozen-scroll');
      const scrollTop=scrollEl?scrollEl.scrollTop:0;
      renderTab();
      const newScrollEl=document.querySelector('.frozen-scroll');
      if(newScrollEl) newScrollEl.scrollTop=scrollTop;
      showToast(shifted.length>0?`Saved (${shifted.length} IN entry moved to next working day)`:'Saved');
    },
    async clear(){
      if(!confirm('Clear all entries for this day?')) return;
      if(S.bankDaily[accId]) delete S.bankDaily[accId][ds];
      await saveDailyData(accId, S.bankDaily[accId]||{});
      closeSheet();
      const scrollEl=document.querySelector('.frozen-scroll');
      const scrollTop=scrollEl?scrollEl.scrollTop:0;
      renderTab();
      const newScrollEl=document.querySelector('.frozen-scroll');
      if(newScrollEl) newScrollEl.scrollTop=scrollTop;
      showToast('Cleared');
    }
  };
  function refreshDS(){const w=document.querySelector('#sheet-wrap .sheet');if(w)w.innerHTML=buildDS();}
  openSheet(buildDS());
};

// ── PUSH NOTIFICATIONS ────────────────────────────────────────────────────────
// VAPID public key is meant to be public (proves pushes come from this app);
// the matching private key lives only in the send-push Edge Function's secrets.
const VAPID_PUBLIC_KEY = 'BI1efZq1OS85b7_A9RIul6wUHa8HmgaZSuXXYc_6jg12nRVSO2gNIjDmXAepCGeLwjQ_ledDvjQL7Y6umXuhRy0';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

window.enablePushNotifications = async function() {
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) {
    alert('Push notifications are not supported on this browser.');
    return;
  }
  try {
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') {
      showToast('Notifications not enabled');
      renderSettingsIfOpen();
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const res = await fetch(SUPABASE_URL + '/functions/v1/save-subscription', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ token: getToken(), subscription: subscription.toJSON() }),
    });
    if(!res.ok) throw new Error('Server rejected subscription');
    showToast('Notifications enabled');
  } catch(err) {
    console.warn('[push] enable failed', err);
    alert('Could not enable notifications: ' + (err && err.message ? err.message : err));
  }
  renderSettingsIfOpen();
};

window.disablePushNotifications = async function() {
  try {
    const reg = await navigator.serviceWorker.getRegistration('sw.js');
    const sub = reg ? await reg.pushManager.getSubscription() : null;
    if(sub) {
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      try {
        await fetch(SUPABASE_URL + '/functions/v1/delete-subscription', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          },
          body: JSON.stringify({ token: getToken(), endpoint }),
        });
      } catch(err) { console.warn('[push] server-side unsubscribe failed', err); }
    }
    showToast('Notifications disabled');
  } catch(err) {
    console.warn('[push] disable failed', err);
    alert('Could not disable notifications: ' + (err && err.message ? err.message : err));
  }
  refreshPushStatusArea();
};

function renderSettingsIfOpen() {
  const body=document.querySelector('#sheet-wrap .sheet-body');
  if(body) body.innerHTML=renderSettings();
  refreshPushStatusArea();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const TAB_DEFS = [
  {id:'advisor',  icon:'🔍', label:'Advisor'},
  {id:'bills',    icon:'💳', label:'Bills'},
  {id:'monthly',  icon:'🏦', label:'Monthly'},
  {id:'accounts', icon:'💰', label:'Accounts'},
  {id:'summary',  icon:'📊', label:'Spending'},
  {id:'rates',    icon:'📋', label:'Rates'},
  {id:'insurance',icon:'🛡️', label:'Insurance'},
];

function renderTabBar() {
  document.getElementById('tabbar').innerHTML = TAB_DEFS.map(t=>
    `<button class="tab-btn ${S.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">
      <span class="tab-icon">${t.icon}</span>
      <span class="tab-label">${t.label}</span>
    </button>`
  ).join('');
}

function getNavHtml() {
  switch(S.tab) {
    case 'bills':
      return `<div class="nav" style="padding-top:max(12px,env(safe-area-inset-top))">
        <button class="nav-arrow" onclick="changeMonth('bills',-1)">‹</button>
        <span class="nav-title">${MONTHS[S.billsMonth]} ${S.billsYear}</span>
        <button class="nav-arrow" onclick="changeMonth('bills',1)">›</button>
        <button class="nav-btn" onclick="refreshEntriesData()">🔄</button>
        <button class="nav-btn" onclick="exportBillsXLSX()">⬆ XLS</button>
      </div>`;
    case 'summary':
      return `<div class="nav" style="padding-top:max(12px,env(safe-area-inset-top))">
        <button class="nav-arrow" onclick="changeMonth('summary',-1)">‹</button>
        <span class="nav-title">${MONTHS[S.summaryMonth]} ${S.summaryYear}</span>
        <button class="nav-arrow" onclick="changeMonth('summary',1)">›</button>
        <button class="nav-btn" onclick="refreshEntriesData()">🔄</button>
        <button class="nav-btn" onclick="exportSummaryXLSX()">⬆ XLS</button>
      </div>`;
    case 'monthly':
      const isAcctSetup = (S.bankSetup[S.monthlyAccount]||{}).isSetup;
      return `<div class="nav" style="padding-top:max(12px,env(safe-area-inset-top))">
        <button class="nav-arrow" onclick="changeMonth('monthly',-1)">‹</button>
        <span class="nav-title">${MONTHS[S.monthlyMonth]} ${S.monthlyYear}</span>
        <button class="nav-arrow" onclick="changeMonth('monthly',1)">›</button>
        <button class="nav-btn" onclick="refreshMonthlyData()">🔄</button>
        ${isAcctSetup ? '' : '<button class="nav-btn" onclick="openSetupSheet()">🏦</button>'}
        <button class="nav-btn" onclick="exportMonthlyXLSX()">⬆ XLS</button>
      </div>`;
    case 'accounts':
      return `<div class="nav" style="padding-top:max(12px,env(safe-area-inset-top))">
        <button class="nav-arrow" onclick="S.accountsYear--;renderTab()">‹</button>
        <span class="nav-title">${S.accountsYear}</span>
        <button class="nav-arrow" ${S.accountsYear>=new Date().getFullYear()?'disabled':''} onclick="S.accountsYear++;renderTab()">›</button>
        <button class="nav-btn" onclick="refreshMonthlyData()">🔄</button>
      </div>`;
    case 'insurance':
      return `<div class="nav" style="padding-top:max(12px,env(safe-area-inset-top))">
        <button class="nav-arrow" onclick="S.insYear--;renderTab()">‹</button>
        <span class="nav-title">${S.insYear}</span>
        <button class="nav-arrow" onclick="S.insYear++;renderTab()">›</button>
        <button class="nav-btn" onclick="refreshInsuranceData()">🔄</button>
        <button class="nav-btn" onclick="openAddIns()">+</button>
      </div>`;
    default: return `<div style="height:calc(env(safe-area-inset-top,0px) + 46px)"></div>`;
  }
}

function getSegCtrlHtml() {
  if(S.tab==='monthly') {
    return `<div class="seg-ctrl">
      ${BANK_ACCOUNTS.map(a=>`<button class="seg-btn ${S.monthlyAccount===a.id?'active':''}" onclick="switchAccount('${a.id}')">${a.label}</button>`).join('')}
    </div>`;
  }
  if(S.tab==='accounts') {
    return `<div class="seg-ctrl">
      ${BANK_ACCOUNTS.map(a=>`<button class="seg-btn ${S.accountsAccount===a.id?'active':''}" onclick="S.accountsAccount='${a.id}';renderTab()">${a.label}</button>`).join('')}
    </div>`;
  }
  return '';
}

function getFabHtml() {
  if(S.tab==='bills') return `<button class="fab" onclick="openAddBill()">+</button>`;
  if(S.tab==='insurance') return `<button class="fab" onclick="openAddIns()">+</button>`;
  return '';
}

function renderTab() {
  let html='';
  switch(S.tab) {
    case 'advisor':   html=renderAdvisor(); break;
    case 'bills':     html=renderBills(); break;
    case 'summary':   html=renderSummary(); break;
    case 'monthly':   html=renderMonthly(); break;
    case 'accounts':  html=renderAccounts(); break;
    case 'rates':     html=renderRates(); break;
    case 'insurance': html=renderInsurance(); break;
  }
  const nav=getNavHtml();
  const seg=getSegCtrlHtml();
  const fab=getFabHtml();
  const contentEl=document.getElementById('content');
  // Frozen layout on every tab: nav/seg (month-year or year selectors) pinned at top,
  // only the tab's own body scrolls in the middle. Tabs with no nav (Advisor, Rates)
  // just get an empty top strip, so their own internal header scrolls as part of the body.
  let topExtra='', scrollHtml='', bottomHtml='';
  if(html && typeof html==='object') {
    topExtra = html.top||'';
    scrollHtml = html.scroll||'';
    bottomHtml = html.bottom||'';
  } else {
    scrollHtml = html;
  }
  contentEl.classList.add('frozen');
  contentEl.innerHTML = `<div class="frozen-top">${nav}${seg}${topExtra}</div>`+
    `<div class="frozen-scroll">${scrollHtml}</div>`+
    (bottomHtml?`<div class="frozen-bottom">${bottomHtml}</div>`:'');
  // Remove old FAB
  document.querySelectorAll('.fab').forEach(el=>el.remove());
  if(fab) document.getElementById('app').insertAdjacentHTML('beforeend',fab);
}

function render() {
  renderTabBar();
  renderTab();
}

window.refreshMonthlyData = async function() {
  showToast('Refreshing…');
  try {
    for(const acc of BANK_ACCOUNTS) {
      S.bankSetup[acc.id] = await loadBankSetup(acc.id);
      S.bankDaily[acc.id] = await loadDailyData(acc.id);
    }
    renderTab();
    showToast('Refreshed');
  } catch(err) {
    console.warn(err);
    showToast('Refresh failed');
  }
};

window.refreshEntriesData = async function() {
  showToast('Refreshing…');
  try {
    S.entries = await loadEntries();
    renderTab();
    showToast('Refreshed');
  } catch(err) {
    console.warn(err);
    showToast('Refresh failed');
  }
};

window.refreshInsuranceData = async function() {
  showToast('Refreshing…');
  try {
    S.insurance = await loadInsurance();
    renderTab();
    showToast('Refreshed');
  } catch(err) {
    console.warn(err);
    showToast('Refresh failed');
  }
};

window.switchTab = function(tab) {
  S.tab=tab;
  render();
  document.getElementById('content').scrollTop=0;
  if(tab==='monthly' && !(S.bankSetup[S.monthlyAccount]||{}).isSetup) openSetupSheet();
};

window.switchAccount = function(acc) {
  S.monthlyAccount=acc;
  renderTab();
  if(!(S.bankSetup[acc]||{}).isSetup) openSetupSheet();
};

window.changeMonth = function(scope, dir) {
  const yKey=scope+'Year', mKey=scope+'Month';
  let m=S[mKey]+dir, y=S[yKey];
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  S[mKey]=m; S[yKey]=y;
  renderTab();
};

function exportMonthlyXLSX() {
  const accId=S.monthlyAccount;
  const setup=S.bankSetup[accId]||{};
  const daily=S.bankDaily[accId]||{};
  const y=S.monthlyYear,m=S.monthlyMonth;
  const days=daysInMonth(y,m);
  let bal=setup.initBal||0;
  const rows=[['Date','Balance ($)','In ($)','Out ($)','Remark']];
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayRows=daily[ds]||[];
    const dayIn=dayRows.reduce((s,r)=>s+(r.in||0),0);
    const dayOut=dayRows.reduce((s,r)=>s+(r.out||0),0);
    if(setup.initDate&&ds>=setup.initDate){bal+=dayIn;bal-=dayOut;}
    const remark=dayRows.map(r=>r.remark).filter(Boolean).join(', ');
    rows.push([ds,setup.initDate&&ds>=setup.initDate?+bal.toFixed(2):'',dayIn||'',dayOut||'',remark]);
  }
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:12},{wch:10},{wch:10},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,`${BANK_ACCOUNTS.find(a=>a.id===accId)?.label} ${MONTHS[m]} ${y}`);
  XLSX.writeFile(wb,`monthly_${accId}_${y}-${String(m+1).padStart(2,'0')}.xlsx`);
  showToast('Exported!');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('content').innerHTML='<div class="loading">Loading…</div>';
  renderTabBar();
  try {
    [S.entries, S.settings, S.insurance] = await Promise.all([loadEntries(), loadSettings(), loadInsurance()]);
    for(const acc of BANK_ACCOUNTS) {
      S.bankSetup[acc.id] = await loadBankSetup(acc.id);
      S.bankDaily[acc.id] = await loadDailyData(acc.id);
    }
    await autoSeedYearlyInsurance();
    await autoSyncAllInsuranceToBills();
  } catch(e) { console.warn('Init error', e); }
  render();
  applyNotificationNavFromUrl();
}

// ── NOTIFICATION TAB ROUTING ───────────────────────────────────────────────────
function applyNotificationNav(tab, account) {
  if(!tab) return;
  if(account && tab === 'monthly') S.monthlyAccount = account;
  if(account && tab === 'accounts') S.accountsAccount = account;
  switchTab(tab);
}

function applyNotificationNavFromUrl() {
  const params = new URLSearchParams(location.search);
  const tab = params.get('tab');
  const account = params.get('account');
  if(tab) {
    applyNotificationNav(tab, account);
    history.replaceState({}, '', location.pathname); // don't keep forcing this tab on future reloads
  }
}

// While the app is already open, a notification tap focuses this tab and
// posts a message here instead of navigating a URL (see sw.js).
if('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', (event) => {
    if(event.data && event.data.type === 'navigate-tab') {
      applyNotificationNav(event.data.tab, event.data.account);
    }
  });
}

// ── LOGIN TOKEN GATE ──────────────────────────────────────────────────────────
async function validateLoginToken(token) {
  if(!token) return false;
  try {
    const {data, error} = await db.rpc('validate_login_token', {p_token: token});
    if(error) { console.warn('[login] validate error', error); return false; }
    return data === true;
  } catch(err) { console.warn('[login] validate failed', err); return false; }
}

function showLoginPrompt(errorMsg) {
  document.body.insertAdjacentHTML('beforeend', `
    <div id="login-overlay" class="login-overlay">
      <div class="login-box">
        <div style="font-size:40px;margin-bottom:12px">🔒</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:6px">Login Required</div>
        <div style="font-size:13px;color:var(--label2);margin-bottom:16px;text-align:center">Enter your login token to continue</div>
        <input id="login-token-input" class="field-input" type="text" placeholder="Login token" autocapitalize="off" autocorrect="off" spellcheck="false" style="margin-bottom:10px;width:100%" onkeydown="if(event.key==='Enter')submitLoginToken()">
        <div id="login-error" style="color:var(--red);font-size:13px;margin-bottom:10px;display:${errorMsg?'block':'none'}">${errorMsg?escHtml(errorMsg):''}</div>
        <button class="save-btn" style="width:100%" onclick="submitLoginToken()">Continue</button>
      </div>
    </div>`);
  document.getElementById('login-token-input').focus();
}

window.submitLoginToken = async function() {
  const input = document.getElementById('login-token-input');
  const token = input.value.trim();
  if(!token) return;
  const btn = document.querySelector('#login-overlay .save-btn');
  const errEl = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Checking…'; errEl.style.display = 'none';
  const valid = await validateLoginToken(token);
  if(valid) {
    localStorage.setItem('loginToken', token);
    document.getElementById('login-overlay').remove();
    init();
  } else {
    btn.disabled = false; btn.textContent = 'Continue';
    errEl.textContent = 'Invalid token. Please try again.';
    errEl.style.display = 'block';
    input.value = '';
    input.focus();
  }
};

async function bootWithAuth() {
  const stored = localStorage.getItem('loginToken');
  if(stored) {
    const valid = await validateLoginToken(stored);
    if(valid) { init(); return; }
    localStorage.removeItem('loginToken');
    showLoginPrompt('Your login token is no longer valid. Please enter a new one.');
    return;
  }
  showLoginPrompt();
}

bootWithAuth();
